<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EA580C;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Lightning bolt -->
  <g transform="translate(400,200)" opacity="0.25">
    <path d="M-20,-100 L20,-100 L5,-15 L50,-15 L-30,100 L-10,10 L-50,10 Z" fill="white" stroke="none"/>
  </g>
  <!-- Tools pattern -->
  <g opacity="0.08" fill="white">
    <circle cx="100" cy="80" r="30"/>
    <circle cx="700" cy="320" r="25"/>
    <rect x="200" y="300" width="60" height="12" rx="6"/>
    <rect x="550" y="60" width="50" height="10" rx="5"/>
  </g>
</svg>
