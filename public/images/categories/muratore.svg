<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Brick wall pattern -->
  <g transform="translate(400,180)" opacity="0.25">
    <!-- Bricks -->
    <rect x="-80" y="-50" width="70" height="30" rx="3" fill="white"/>
    <rect x="10" y="-50" width="70" height="30" rx="3" fill="white"/>
    <rect x="-45" y="-10" width="70" height="30" rx="3" fill="white"/>
    <rect x="45" y="-10" width="70" height="30" rx="3" fill="white"/>
    <rect x="-80" y="30" width="70" height="30" rx="3" fill="white"/>
    <rect x="10" y="30" width="70" height="30" rx="3" fill="white"/>
  </g>
  <!-- Trowel -->
  <g opacity="0.08" fill="white">
    <path d="M650,80 L700,60 L710,90 L660,110 Z"/>
    <rect x="640" y="105" width="8" height="40" rx="4"/>
    <path d="M120,300 L170,280 L180,310 L130,330 Z"/>
    <rect x="110" y="325" width="8" height="40" rx="4"/>
  </g>
</svg>
