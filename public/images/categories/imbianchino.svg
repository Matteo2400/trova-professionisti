<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D9488;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Paint roller -->
  <g transform="translate(400,180)" opacity="0.25">
    <rect x="-50" y="-60" width="100" height="50" rx="10" fill="white"/>
    <rect x="-5" y="-10" width="10" height="80" rx="5" fill="white"/>
    <rect x="-20" y="70" width="40" height="15" rx="5" fill="white"/>
  </g>
  <!-- Color splashes -->
  <g opacity="0.08" fill="white">
    <circle cx="120" cy="100" r="40"/>
    <circle cx="680" cy="300" r="35"/>
    <circle cx="200" cy="320" r="20"/>
    <circle cx="620" cy="80" r="25"/>
  </g>
</svg>
